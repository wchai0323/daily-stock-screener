name: Finder - KR theme tagging

# 보류: GitHub Models가 Actions에서 실제 응답을 주지 않음(본문 "OK"만 반환). 태깅은 Claude 세션에서 한다.
# 유료 API(ANTHROPIC_API_KEY)로 돌릴 때 수동 실행용으로 남겨 둔다.
on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: finder-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 테마 태깅
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_COMPANIES=$(grep -oP '^max=\K\d*' tools/finder_tag_run.txt || true) \
          TAG_MODEL=$(grep -oP '^model=\K\S*' tools/finder_tag_run.txt || true) \
          DEADLINE_MIN=300 python tools/finder_tag.py 2>&1 | tee data/finder/tag.log
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/finder
          if ! git diff --cached --quiet; then
            git commit -m "finder: KR theme tags $(TZ=Asia/Seoul date +%F-%H%M)"
            git pull --rebase
            git push
          fi
